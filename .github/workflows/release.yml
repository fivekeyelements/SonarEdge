name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in app_version.py as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          New-Item -ItemType Directory -Path build/tools -Force | Out-Null
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile build/tools/inno-setup.exe
          $signature = Get-AuthenticodeSignature build/tools/inno-setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Inno Setup signature verification failed' }
          $compilerDirectory = Join-Path $PWD 'build/tools/inno'
          python -c "import subprocess,sys; sys.exit(subprocess.call(sys.argv[1:]))" (Resolve-Path build/tools/inno-setup.exe) '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART' '/NOICONS' '/CURRENTUSER' "/DIR=$compilerDirectory"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler setup failed' }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/MicrosoftEdgeWebview2Setup.exe
          $webviewSignature = Get-AuthenticodeSignature packaging/MicrosoftEdgeWebview2Setup.exe
          if ($webviewSignature.Status -ne 'Valid' -or $webviewSignature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'WebView2 bootstrapper signature verification failed' }
      - name: Test
        run: |
          python -m unittest discover -q
          node --check web/app.js
          node test_visuals.cjs
          node test_widget_fit.cjs
          node test_iframe_reconnect.cjs
      - name: Build application and installers
        run: |
          python build_native.py
          python build_installer.py
          python build_installer.py --test
      - name: Verify release and installer lifecycle
        run: |
          python verify_release.py
          python verify_installer.py
      - uses: actions/upload-artifact@v7
        with:
          name: SonarEdge-Windows-x64
          path: |
            releases/SonarEdge-Setup-*-Windows-x64.exe
            releases/SonarEdge-*-Windows-x64.zip
            releases/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c 'from app_version import VERSION; print(VERSION)'
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag must match app_version.py' }
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'This version is already public. Bump VERSION before publishing again.' }
            gh release upload $tag "releases/SonarEdge-Setup-$version-Windows-x64.exe" "releases/SonarEdge-$version-Windows-x64.zip" releases/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
            gh release edit $tag --draft=false --latest --title "Sonar Edge $version"
          } else {
            gh release create $tag "releases/SonarEdge-Setup-$version-Windows-x64.exe" "releases/SonarEdge-$version-Windows-x64.zip" releases/SHA256SUMS.txt --title "Sonar Edge $version" --generate-notes --latest --target $env:GITHUB_SHA
          }
