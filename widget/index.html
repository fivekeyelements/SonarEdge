<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="x-icue-widget-group" content="'Sonar Edge'" />
<title>Sonar Edge XL</title>
<link rel="icon" href="icon.svg" />
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#eeeef3;font-family:Segoe UI,sans-serif}iframe{position:fixed;inset:0;display:block;width:100vw;height:100vh;border:0;margin:0;padding:0;visibility:hidden}body.connected iframe{visibility:visible}.reconnect{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.reconnect h1{font-size:clamp(24px,3vw,44px);margin:0 0 16px}.reconnect p{font-size:clamp(18px,2vw,28px);line-height:1.4;color:#b7c2cf;max-width:850px}.reconnect button{font:600 22px Segoe UI,sans-serif;padding:16px 28px;background:#8de4c7;color:#101318;border:0;border-radius:12px;cursor:pointer}body.connected .reconnect{display:none}</style>
</head><body>
<div class="reconnect" role="status"><div><h1>Sonar Edge for iCUE</h1><p>Open Sonar Edge and choose the iCUE iframe version.<br>Your controls reconnect automatically.</p><button id="retry">Reconnect</button></div></div>
<iframe id="panel" src="http://127.0.0.1:47832/?icue=xl" title="Sonar Edge" allow="fullscreen"></iframe>
<script>
window.icueEvents={onICUEInitialized:function(){},onDataUpdated:function(){}};
const panel=document.getElementById('panel');let lastReady=0,lastReload=Date.now();
window.addEventListener('message',event=>{
  if(event.source!==panel.contentWindow||event.origin!=='http://127.0.0.1:47832'||event.data?.type!=='sonar-edge-ready')return;
  lastReady=Date.now();document.body.classList.add('connected');
});
function reconnect(){lastReady=0;lastReload=Date.now();document.body.classList.remove('connected');panel.src='http://127.0.0.1:47832/?icue=xl';}
document.getElementById('retry').addEventListener('click',reconnect);
setInterval(()=>{if(Date.now()-lastReady>12000){document.body.classList.remove('connected');if(Date.now()-lastReload>8000)reconnect();}},3000);
</script>
</body></html>
